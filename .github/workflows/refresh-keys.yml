name: Refresh keys

# Auto-update + auto-repair key refresh.
#
# Auto-update:
#   * Runs every 12 hours (00:00 / 12:00 UTC) and on manual dispatch.
#   * Fetches the current hCaptcha build, extracts all SIX master keys
#     (3 HSJ + 3 HSW incl. the n_key captured at the AES encrypt call site),
#     writes data/keys.json, and archives data/archive/<version>.json.
#   * Commits + pushes only when the build hash rotated.
#
# Auto-repair:
#   * Each extraction attempt is retried with backoff (rate limits).
#   * A failed / partial extraction NEVER overwrites the last known-good
#     keys and NEVER fails the scheduled run on the default branch.
#   * On persistent failure the workflow opens (or updates) a tracked
#     issue describing exactly what broke, so the extractor can be fixed.
#   * The dependency install is retried once with a clean npm cache.
#
# Average runtime: ~3 minutes end-to-end on the happy path.

on:
  schedule:
    # Every 10 minutes. hCaptcha rotates its asset build frequently
    # (~10 min); polling at the same cadence maximises the chance of
    # catching a build whose structure the extractor understands, and
    # keeps data/keys.json as fresh as possible once extraction succeeds.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force a commit even if the build hash is unchanged"
        required: false
        type: boolean
        default: false

permissions:
  contents: write            # so the bot can push to main
  issues: write              # so auto-repair can file a tracking issue

concurrency:
  group: refresh-keys
  cancel-in-progress: false  # let any in-flight run finish

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ok: ${{ steps.extract.outputs.ok }}
      version: ${{ steps.extract.outputs.version }}
      reason: ${{ steps.extract.outputs.reason }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: System libraries for canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install Python deps
        run: pip install pycryptodome xxhash msgpack jsbeautifier requests

      - name: Install Node deps (auto-repair — retry with clean cache)
        run: |
          set -euo pipefail
          # `npm ci` (not `npm install`) — deterministic install from the
          # lockfile that NEVER modifies package-lock.json. `npm install`
          # silently rewrites the lockfile when npm's lockfile schema
          # differs from what's checked in, leaving the file as an
          # unstaged tracked-file modification that breaks `git rebase`
          # in the retry-on-push-rejection block below.
          if ! npm ci --no-audit --no-fund; then
            echo "::warning::npm ci failed — repairing with a clean cache"
            npm cache clean --force
            rm -rf node_modules
            npm ci --no-audit --no-fund
          fi

      - name: Extract all six keys
        id: extract
        # The auto-repair design: never let a rotated/broken build take
        # the scheduler down. The dedicated repair step below reacts to
        # ok != true.
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          set -uo pipefail

          ok=0
          reason=""
          # Up to 4 attempts (hCaptcha sometimes rate-limits).
          for attempt in 1 2 3 4; do
            if python -m hcaptcha > new_keys.json 2> fetch.log; then
              ok=1
              break
            fi
            reason="$(tail -n 1 fetch.log || true)"
            echo "::warning::extraction attempt $attempt failed: $reason"
            tail -n 25 fetch.log || true
            sleep $((attempt * 30))
          done

          if [ "$ok" -ne 1 ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "::warning::auto-repair: extraction failed on all attempts"
            exit 0
          fi

          # Validate JSON parses + has all six keys + verification flags.
          if ! python <<'EOF'
          import json, sys
          d = json.load(open("new_keys.json"))
          required_hsj = {"n_key", "response_decrypt_key", "payload_encrypt_key"}
          required_hsw = {"encrypt_key", "decrypt_key", "n_key", "fingerprint_blob_key"}
          missing = []
          if not required_hsj.issubset(d.get("hsj", {})): missing.append("hsj")
          if not required_hsw.issubset(d.get("hsw", {})): missing.append("hsw")
          # every key must be a non-empty 64-char hex string
          for group in ("hsj", "hsw"):
              for k, v in d.get(group, {}).items():
                  if not (isinstance(v, str) and len(v) == 64):
                      missing.append(f"{group}.{k}")
          # Verify the 4 HSW verification flags
          verified = d.get("verified", {})
          for k in ("hsw_encrypt_key", "hsw_decrypt_key", "hsw_n_key",
                    "hsw_fingerprint_blob_key"):
              if not verified.get(k):
                  missing.append(f"verified.{k}")
          if missing:
              sys.exit(f"output validation failed: missing {missing}")
          print(f"validated: version {d['version'][:12]}...")
          print(f"  hsw.n_key  : {d['hsw']['n_key'][:16]}...")
          print(f"  fp_blob_key: {d['hsw']['fingerprint_blob_key'][:16]}...")
          EOF
          then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=output validation failed (see log)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(python -c "import json; print(json.load(open('new_keys.json'))['version'])")
          echo "ok=true"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "reason=ok"     >> "$GITHUB_OUTPUT"

      - name: Write current + archive
        if: steps.extract.outputs.ok == 'true'
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p data data/archive
          mv new_keys.json data/keys.json
          cp data/keys.json "data/archive/${VERSION}.json"
          ls -la data/ data/archive/ | tail -n 20

      - name: Commit + push if changed
        if: steps.extract.outputs.ok == 'true'
        env:
          VERSION: ${{ steps.extract.outputs.version }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if [ "${FORCE:-false}" != "true" ] && git diff --staged --quiet; then
            echo "build hash unchanged — skipping commit"
            exit 0
          fi
          git commit -m "auto: refresh keys for build ${VERSION:0:12}" || {
            echo "nothing to commit"; exit 0; }

          # Reset any unstaged modifications to tracked files (e.g. a
          # lockfile npm touched, line-ending drift) so the rebase below
          # sees a clean working tree. Our commit is preserved.
          git checkout -- . || true

          # Retry up to 5 times: another push may land between fetch and push.
          for attempt in 1 2 3 4 5; do
            if git push 2> push.err; then
              echo "committed + pushed (attempt $attempt)"
              exit 0
            fi
            if ! grep -q "rejected\|non-fast-forward\|fetch first" push.err; then
              cat push.err
              exit 1
            fi
            echo "push rejected (attempt $attempt) — rebasing on origin/main"
            git fetch origin main
            git rebase origin/main || git rebase --abort || true
            sleep $((attempt * 2))
          done

          echo "::error::push still rejected after 5 attempts"
          exit 1

      # -----------------------------------------------------------------
      # Auto-repair: file / update a tracking issue with the exact failure
      # so the extractor can be repaired. Keeps last known-good keys.
      # -----------------------------------------------------------------
      - name: Auto-repair — report extraction failure
        if: steps.extract.outputs.ok != 'true'
        uses: actions/github-script@v7
        env:
          REASON: ${{ steps.extract.outputs.reason }}
        with:
          script: |
            const reason = (process.env.REASON || "unknown").slice(0, 1500);
            const title = "auto-repair: key extraction failed";
            const body = [
              "The scheduled **Refresh keys** run could not extract the master keys.",
              "",
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Workflow: .github/workflows/refresh-keys.yml`,
              `- Failure: \`${reason}\``,
              "",
              "The last known-good `data/keys.json` was **left untouched**.",
              "",
              "hCaptcha most likely rotated/restructured its bundle. " +
              "Update the extractor (see `docs/04-key-extraction.md`) — the " +
              "`hcaptcha.hsj` / `hcaptcha.hsw` modules raise an explicit " +
              "\"pattern not found\" error in that case.",
            ].join("\n");
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "auto-repair",
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["auto-repair"],
              });
            }

      - name: Auto-repair — fix resolved
        if: steps.extract.outputs.ok == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "auto-repair: key extraction failed";
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "auto-repair",
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: "✅ Key extraction succeeded again — closing auto-repair issue.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
